# ============================================================
# Mimshach — Cloudflare Pages + D1 + R2 configuration
# Deploy:  npm run deploy
# DB init: npm run db:migrate
# ============================================================

name                  = "mimshach"
pages_build_output_dir = "dist"
compatibility_date    = "2026-06-01"
compatibility_flags   = ["nodejs_compat"]

[observability]
enabled = true

# ─── D1 Database ─────────────────────────────────────────────
[[d1_databases]]
binding       = "DB"
database_name = "mimshach-db"
database_id   = "6097ebc5-635b-436e-9b2b-0f8971b12eba"

# ─── R2 Image Storage ────────────────────────────────────────
[[r2_buckets]]
binding     = "STORAGE"
bucket_name = "mimshach-images"

# ─── Production Environment Variables ────────────────────────
[vars]
ENVIRONMENT    = "production"
SHOP_NAME      = "Mimshach Household Collection"
ADMIN_WHATSAPP = "254706752174"

# ─── Preview Environment (branch deploys) ────────────────────
[env.preview]

[env.preview.vars]
ENVIRONMENT    = "preview"
SHOP_NAME      = "Mimshach Household Collection"
ADMIN_WHATSAPP = "254706752174"

[[env.preview.d1_databases]]
binding       = "DB"
database_name = "mimshach-db"
database_id   = "6097ebc5-635b-436e-9b2b-0f8971b12eba"

[[env.preview.r2_buckets]]
binding     = "STORAGE"
bucket_name = "mimshach-images"
